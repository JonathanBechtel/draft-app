{# Site Footer with legal links and copyright #}
<footer class="footer">
  <div class="footer-content">
    <!-- Legal links -->
    <div class="footer-links">
      {% for link in footer_links %}
      <a href="{{ link.url }}">{{ link.text }}</a>
      {% if not loop.last %}<span class="footer-divider">|</span>{% endif %}
      {% endfor %}
    </div>

    <!-- Connect / contact links -->
    <div class="footer-connect">
      <a href="https://x.com/jona_b_bechtel" target="_blank" rel="noopener noreferrer">X (Twitter)</a>
      <span class="footer-divider">|</span>
      <a href="mailto:hello@nbadraft.app">hello@nbadraft.app</a>
    </div>

    <!-- Copyright -->
    <div class="footer-copyright">
      <p>&copy; {{ current_year }} DraftGuru. All rights reserved.</p>
    </div>
  </div>
</footer>
