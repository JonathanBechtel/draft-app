<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1260" width="2400" height="1260">
  <defs>
    <style type="text/css">
      .title { font-family: 'Russo One', sans-serif; font-size: 80px; fill: #0f172a; text-transform: uppercase; }
      .subtitle { font-family: 'Azeret Mono', monospace; font-size: 36px; fill: #64748b; }
      .section-label { font-family: 'Russo One', sans-serif; font-size: 36px; fill: #64748b; text-transform: uppercase; letter-spacing: 2px; }
      .zone-name { font-family: 'Azeret Mono', monospace; font-size: 32px; fill: #334155; }
      .zone-value { font-family: 'Azeret Mono', monospace; font-size: 36px; fill: #0f172a; font-weight: 600; }
      .zone-freq { font-family: 'Azeret Mono', monospace; font-size: 28px; fill: #64748b; }
      .fga-count { font-family: 'Azeret Mono', monospace; font-size: 28px; fill: #94a3b8; }
      .diet-label { font-family: 'Russo One', sans-serif; font-size: 32px; fill: #64748b; text-transform: uppercase; letter-spacing: 1px; }
      .diet-value { font-family: 'Azeret Mono', monospace; font-size: 48px; fill: #0f172a; font-weight: 600; }
      .diet-key { font-family: 'Azeret Mono', monospace; font-size: 26px; fill: #64748b; }
      .player-name { font-family: 'Russo One', sans-serif; font-size: 40px; fill: #0f172a; }
      .player-subtitle { font-family: 'Azeret Mono', monospace; font-size: 28px; fill: #64748b; }
      .watermark { font-family: 'Azeret Mono', monospace; font-size: 32px; fill: #ffffff; }
      .suppressed-note { font-family: 'Azeret Mono', monospace; font-size: 30px; fill: #f59e0b; }
    </style>
    <!-- Scanlines pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#0f172a" stroke-width="1" opacity="0.03"/>
    </pattern>
    <!-- Dot matrix pattern -->
    <pattern id="dotmatrix" patternUnits="userSpaceOnUse" width="24" height="24">
      <circle cx="12" cy="12" r="1" fill="#64748b" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="2400" height="1260" fill="#f8fafc"/>
  <rect width="2400" height="1260" fill="url(#dotmatrix)"/>
  <rect width="2400" height="1260" fill="url(#scanlines)"/>

  <!-- Accent bar at top -->
  <rect x="0" y="0" width="2400" height="12" fill="{{ accent_color }}"/>

  <!-- Header section -->
  <g transform="translate(96, 80)">
    <!-- Player photo or placeholder -->
    {% if player.has_photo and player.photo_data_uri %}
    <clipPath id="photo-clip">
      <rect x="0" y="30" width="200" height="200" rx="12"/>
    </clipPath>
    <image href="{{ player.photo_data_uri }}" x="0" y="30" width="200" height="200" clip-path="url(#photo-clip)" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="30" width="200" height="200" rx="12" fill="none" stroke="{{ accent_color }}" stroke-width="4"/>
    {% else %}
    <rect x="0" y="30" width="200" height="200" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <text x="100" y="120" text-anchor="middle" class="zone-name" fill="#475569">{{ player.name.split()[0] }}</text>
    {% if player.name.split() | length > 1 %}
    <text x="100" y="160" text-anchor="middle" class="zone-name" fill="#475569">{{ player.name.split()[1:] | join(' ') }}</text>
    {% endif %}
    {% endif %}

    <!-- Title and subtitle -->
    <text x="240" y="50" class="title">{{ title }}</text>
    <text x="240" y="105" class="subtitle">{{ subtitle }}</text>

    <!-- Player info -->
    <text x="240" y="185" class="player-name">{{ player.name }}</text>
    <text x="240" y="225" class="player-subtitle">{{ player.subtitle }}</text>

    <!-- FGA badge (top right) -->
    <rect x="1940" y="30" width="368" height="72" rx="8" fill="{{ accent_color }}" opacity="0.12"/>
    <rect x="1940" y="30" width="368" height="72" rx="8" fill="none" stroke="{{ accent_color }}" stroke-width="2"/>
    <text x="2124" y="82" text-anchor="middle" font-family="'Russo One', sans-serif" font-size="40" fill="{{ accent_color }}">{{ total_fga }} FGA</text>
  </g>

  <!-- Divider line -->
  <line x1="96" y1="338" x2="2304" y2="338" stroke="#e2e8f0" stroke-width="2"/>

  {% if suppressed %}
  <!-- Small sample notice (chart suppressed) -->
  <g transform="translate(96, 375)">
    <text x="0" y="0" class="section-label">Zone Breakdown</text>
    <text x="0" y="50" class="suppressed-note">⚠ Small sample (&lt;20 FGA) — zone table shown; heat chart requires ≥20 FGA</text>
  </g>
  {% else %}
  <g transform="translate(96, 375)">
    <text x="0" y="0" class="section-label">Zone Breakdown</text>
  </g>
  {% endif %}

  <!-- Column headers -->
  <g transform="translate(96, 415)">
    <text x="0" y="0" class="section-label" font-size="28" fill="#94a3b8">Zone</text>
    <text x="520" y="0" class="section-label" font-size="28" fill="#94a3b8">Freq%</text>
    <text x="1320" y="0" class="section-label" font-size="28" fill="#94a3b8">FG%</text>
    <text x="1750" y="0" class="section-label" font-size="28" fill="#94a3b8">vs Pool</text>
    <text x="2208" y="0" text-anchor="end" class="section-label" font-size="28" fill="#94a3b8">FGA</text>
  </g>

  <!-- Zone rows -->
  <g transform="translate(96, 445)">
    {% for zone in zones %}
    {% set y_offset = loop.index0 * 93 %}
    <g transform="translate(0, {{ y_offset }})">

      <!-- Zone name -->
      <text x="0" y="55" class="zone-name">{{ zone.shot_zone_basic }}</text>

      <!-- Freq% bar track -->
      <rect x="480" y="22" width="760" height="40" rx="6" fill="#e2e8f0"/>

      <!-- Freq% bar fill -->
      {% set freq_bar_width = (zone.freq_pct * 760) | round(0) %}
      <rect x="480" y="22" width="{{ freq_bar_width }}" height="40" rx="6" fill="{{ accent_color }}" opacity="0.7"/>

      <!-- Freq% text -->
      <text x="1260" y="53" text-anchor="end" class="zone-freq">{{ zone.freq_pct_display }}</text>

      <!-- FG% value -->
      {% if zone.vs_pool == "above" %}
      {% set fg_color = "#10b981" %}
      {% elif zone.vs_pool == "below" %}
      {% set fg_color = "#f43f5e" %}
      {% elif zone.vs_pool == "average" %}
      {% set fg_color = "#f59e0b" %}
      {% else %}
      {% set fg_color = "#334155" %}
      {% endif %}
      <text x="1320" y="55" class="zone-value" fill="{{ fg_color }}">{{ zone.fg_pct_display }}</text>

      <!-- vs Pool indicator -->
      {% if zone.vs_pool == "above" %}
      <rect x="1720" y="20" width="140" height="44" rx="6" fill="#d1fae5"/>
      <text x="1790" y="52" text-anchor="middle" font-family="'Azeret Mono', monospace" font-size="26" fill="#10b981" font-weight="600">▲ above</text>
      {% elif zone.vs_pool == "below" %}
      <rect x="1720" y="20" width="140" height="44" rx="6" fill="#ffe4e6"/>
      <text x="1790" y="52" text-anchor="middle" font-family="'Azeret Mono', monospace" font-size="26" fill="#f43f5e" font-weight="600">▼ below</text>
      {% elif zone.vs_pool == "average" %}
      <rect x="1720" y="20" width="140" height="44" rx="6" fill="#fef3c7"/>
      <text x="1790" y="52" text-anchor="middle" font-family="'Azeret Mono', monospace" font-size="26" fill="#d97706" font-weight="600">≈ avg</text>
      {% else %}
      <text x="1790" y="52" text-anchor="middle" font-family="'Azeret Mono', monospace" font-size="26" fill="#94a3b8">—</text>
      {% endif %}

      <!-- FGA count -->
      <text x="2208" y="55" text-anchor="end" class="fga-count">{{ zone.fga }}</text>

      <!-- Row separator (subtle) -->
      {% if not loop.last %}
      <line x1="0" y1="80" x2="2112" y2="80" stroke="#e2e8f0" stroke-width="1" opacity="0.7"/>
      {% endif %}

    </g>
    {% endfor %}
  </g>

  <!-- Shot diet row -->
  {% if shot_diet %}
  {% set zones_height = zones | length * 93 %}
  {% set diet_y = 445 + zones_height + 20 %}
  <line x1="96" y1="{{ diet_y - 10 }}" x2="2304" y2="{{ diet_y - 10 }}" stroke="#e2e8f0" stroke-width="2"/>
  <g transform="translate(96, {{ diet_y }})">
    <text x="0" y="35" class="section-label">Shot Diet</text>
    <!-- 4 diet items spread across card -->
    <g transform="translate(0, 55)">
      <!-- Rim -->
      <text x="200" y="0" text-anchor="middle" class="diet-key">Rim</text>
      <text x="200" y="55" text-anchor="middle" class="diet-value">{{ shot_diet.rim_display }}</text>
      <!-- Mid -->
      <text x="720" y="0" text-anchor="middle" class="diet-key">Mid</text>
      <text x="720" y="55" text-anchor="middle" class="diet-value">{{ shot_diet.mid_display }}</text>
      <!-- 3PT -->
      <text x="1240" y="0" text-anchor="middle" class="diet-key">3PT</text>
      <text x="1240" y="55" text-anchor="middle" class="diet-value">{{ shot_diet.three_display }}</text>
      <!-- Corner 3 -->
      <text x="1760" y="0" text-anchor="middle" class="diet-key">Corner 3</text>
      <text x="1760" y="55" text-anchor="middle" class="diet-value">{{ shot_diet.corner3_display }}</text>
    </g>
  </g>
  {% endif %}

  <!-- Footer watermark bar -->
  <rect x="0" y="1148" width="2400" height="112" fill="#1e293b"/>
  <text x="2304" y="1216" text-anchor="end" class="watermark">nbadraft.app</text>
  <!-- Footer accent stripe -->
  <rect x="0" y="1148" width="2400" height="6" fill="{{ accent_color }}" opacity="0.6"/>
  <!-- Scanlines overlay on footer -->
  <rect x="0" y="1148" width="2400" height="112" fill="url(#scanlines)" opacity="0.5"/>
</svg>
