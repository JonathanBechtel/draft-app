name: Deploy to Fly (prod)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (SHA, tag, or branch)"
        required: false
        default: "main"
      enable_desk_cron:
        description: >-
          Create/update the Summer League Desk cron machine on prod (#536). Only set
          true after staging has already proven a successful tick (post-tick smoke
          check green there per docs/plans/summer-league-desk-536-deploy-runbook.md)
          -- this is the deliberate human "promote to prod" step. Even when true,
          production's own preflight must still pass or the step is skipped.
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-prod-deploy
      cancel-in-progress: false

    environment:
      name: draft-app-prod
      url: https://draft-app-prod.fly.dev

    steps:
      - name: Checkout desired ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Assert Fly token present
        run: test -n "${{ secrets.FLY_API_TOKEN }}" || (echo "Missing FLY_API_TOKEN secret"; exit 1)

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app & Alembic
        run: |
          python -m pip install --upgrade pip
          pip install . alembic

      - name: Run Alembic migrations (prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade heads

      # Set prod secrets on the prod app (idempotent; safe to run every deploy)
      - name: Ensure prod secrets exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          flyctl secrets set \
            DATABASE_URL="${PROD_DATABASE_URL}" \
            SECRET_KEY="${PROD_SECRET_KEY}" \
            ENV=prod \
            LOG_LEVEL=INFO \
            ACCESS_LOG=false \
            --app draft-app-prod

      - name: Deploy to prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config deploy/fly/fly.prod.toml \
            --remote-only \
            --app draft-app-prod

      # Reference data the recap joins against (idempotent — skips existing).
      # nba_teams is needed for the team chips; the consensus path doesn't seed
      # it, so do it here before ingesting picks.
      - name: Seed reference data (NBA teams)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: prod
        run: |
          python scripts/seed_nba_teams.py

      # Hydrate the per-year draft-results from their committed canonical files.
      # Idempotent (upsert by year+pick): re-running re-syncs, so appending a new
      # year's file or new picks just needs a re-deploy. Names resolve against
      # this environment's player DB; unmatched picks are reported, not fatal.
      - name: Sync draft results (canonical records)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Importing the app (for shared URL normalization + the matcher)
          # instantiates Settings, which requires these even though the ingest
          # itself doesn't use them.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: prod
        run: |
          shopt -s nullglob
          for f in scripts/data/draft_results_*.txt; do
            echo "== Ingesting $f =="
            python scripts/ingest_draft_results.py --file "$f"
          done

      - name: Update cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "news-ingestion-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            # --command is set on every update, not just at creation: a machine's argv is
            # frozen when `machine run` creates it, so an image-only update happily ships
            # a new image that no longer contains the old entrypoint path. That is exactly
            # how #685 broke this cron on stage -- the deploy went green while every tick
            # died on "can't open file". Re-declaring it here makes the machine converge.
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --command "-m app.cli.cron_runner" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-ingestion-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --command "-m app.cli.summer_league_ingest_runner" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League roster cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-roster-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --command "-m app.cli.summer_league_roster_runner" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      # Keep the approved Desk cron on the current image without interrupting an
      # in-flight tick. `flyctl machine update` sends SIGINT to a running scheduled
      # machine, so wait for its normal stop first; if it does not stop within the
      # safety window, leave the old image in place for this deploy -- the
      # reconciliation step immediately below gets a second, shorter chance, and the
      # final verification step at the end of this job fails the deploy check (not
      # just a warning) if the machine is still drifted after that.
      - name: Update Summer League Desk cron machine (if exists)
        id: desk_cron_update
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-desk-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Waiting for Desk cron machine $CRON_MACHINE_ID to stop before updating"
            if flyctl machine wait "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --state stopped \
              --wait-timeout 30m; then
              echo "Updating stopped Desk cron machine with image: $APP_IMAGE"
              flyctl machine update "$CRON_MACHINE_ID" \
                --app draft-app-prod \
                --image "$APP_IMAGE" \
                --command "-m app.cli.sl_desk_tick" \
                --skip-start \
                --yes
              # `machine update` does not reliably re-arm Fly's hourly schedule for a
              # scheduled machine left stopped -- confirmed by an incident where several
              # same-night deploys each updated-and-left-stopped this machine and it then
              # sat idle for 8+ hours with no further ticks. Starting it here both kicks
              # off an immediate tick on the new image and re-arms the schedule.
              flyctl machine start "$CRON_MACHINE_ID" --app draft-app-prod
              echo "timed_out=false" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Desk cron machine did not stop within 30m; skipping its image update so the active tick is not interrupted. The reconciliation step below will retry once it stops."
              echo "timed_out=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No Desk cron machine found yet (or could not determine app image) -- nothing to update"
            echo "timed_out=false" >> "$GITHUB_OUTPUT"
          fi

      # Second chance for the stop-wait-timeout case above: the in-flight tick that
      # blocked the deploy-time update has had more time to finish by now. Bounded to
      # 10 more minutes -- this is a follow-up retry, not another full 30-minute wait.
      # If the machine still hasn't stopped, the post-deploy verification step at the
      # end of this job will fail the check rather than leave drift unnoticed.
      - name: Reconcile Summer League Desk cron machine (retry after stop-wait timeout)
        if: steps.desk_cron_update.outputs.timed_out == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python scripts/reconcile_cron_image.py \
            --app draft-app-prod \
            --machine summer-league-desk-cron \
            --command "-m app.cli.sl_desk_tick" \
            --wait-timeout-s 600 || \
            echo "::warning::Desk cron reconciliation retry did not land; the post-deploy verification step will fail the check if it is still drifted."

      # #536 -- Summer League Desk cron machine *creation*, gated unlike every other
      # cron in this workflow: (1) the `enable_desk_cron` workflow_dispatch input must
      # be explicitly set true for this run -- a human attesting staging already
      # proved a successful tick -- and (2) production's own read-only preflight check
      # must still pass against the just-deployed prod database. Job A
      # (`scripts/build_sl_cohort_baselines.py`) is NEVER run here -- it's a
      # deliberate, one-time human step against prod (see
      # docs/plans/summer-league-desk-536-deploy-runbook.md).
      - name: Check Summer League Desk readiness (preflight)
        id: desk_preflight
        if: inputs.enable_desk_cron == true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: prod
        run: |
          if python scripts/check_sl_desk_readiness.py preflight; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Summer League Desk preflight failed; skipping Desk cron machine creation this deploy."
          fi

      # Create-if-absent only -- the unconditional step above already refreshes an
      # already-existing machine's image on every deploy, so this never needs to
      # update, only create.
      - name: Create Summer League Desk cron machine (gated)
        if: inputs.enable_desk_cron == true && steps.desk_preflight.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-desk-cron") | .id')
          if [ -z "$APP_IMAGE" ] || [ "$APP_IMAGE" == "null" ]; then
            echo "Could not determine app image; skipping Desk cron machine creation"
          elif [ -n "$CRON_MACHINE_ID" ]; then
            echo "Desk cron machine $CRON_MACHINE_ID already exists; image update was handled above"
          else
            echo "No Desk cron machine found; creating one (schedule=hourly)"
            flyctl machine run "$APP_IMAGE" \
              --app draft-app-prod \
              --schedule hourly \
              --name summer-league-desk-cron \
              --region ewr \
              --memory 1024 \
              --cpus 1 \
              --entrypoint "/app/.venv/bin/python" \
              -- -m app.cli.sl_desk_tick
          fi

      # Post-deploy verification (spec: docs/plans/summer-league-cron-desk-starvation-spec.md
      # proposed work #5) -- fails this deploy check, rather than a silent ::warning::, if
      # any Summer League cron machine is left on a stale image digest after every
      # update/reconcile step above has run. summer-league-desk-cron is the one machine
      # allowed to be entirely absent (it's readiness-gated per #536 and may never have
      # been promoted to this environment) -- but if it exists, drift on it fails the check
      # exactly like the other two. This is the closing net for the stop-wait-timeout case
      # above: even if the reconciliation retry also couldn't land the update, this step
      # makes that drift a failed check instead of something a human has to notice later.
      - name: Verify Summer League cron image digests (post-deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python scripts/verify_cron_image_digests.py \
            --app draft-app-prod \
            --machine summer-league-ingestion-cron \
            --machine summer-league-desk-cron \
            --machine summer-league-roster-cron \
            --optional-machine summer-league-desk-cron
