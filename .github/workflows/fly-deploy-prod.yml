name: Deploy to Fly (prod)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (SHA, tag, or branch)"
        required: false
        default: "main"
      enable_desk_cron:
        description: >-
          Create/update the Summer League Desk cron machine on prod (#536). Only set
          true after staging has already proven a successful tick (post-tick smoke
          check green there per docs/plans/summer-league-desk-536-deploy-runbook.md)
          -- this is the deliberate human "promote to prod" step. Even when true,
          production's own preflight must still pass or the step is skipped.
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-prod-deploy
      cancel-in-progress: false

    environment:
      name: draft-app-prod
      url: https://draft-app-prod.fly.dev

    steps:
      - name: Checkout desired ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Assert Fly token present
        run: test -n "${{ secrets.FLY_API_TOKEN }}" || (echo "Missing FLY_API_TOKEN secret"; exit 1)

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app & Alembic
        run: |
          python -m pip install --upgrade pip
          pip install . alembic

      - name: Run Alembic migrations (prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade heads

      # Set prod secrets on the prod app (idempotent; safe to run every deploy)
      - name: Ensure prod secrets exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          flyctl secrets set \
            DATABASE_URL="${PROD_DATABASE_URL}" \
            SECRET_KEY="${PROD_SECRET_KEY}" \
            ENV=prod \
            LOG_LEVEL=INFO \
            ACCESS_LOG=false \
            --app draft-app-prod

      - name: Deploy to prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config deploy/fly/fly.prod.toml \
            --remote-only \
            --app draft-app-prod

      # Reference data the recap joins against (idempotent — skips existing).
      # nba_teams is needed for the team chips; the consensus path doesn't seed
      # it, so do it here before ingesting picks.
      - name: Seed reference data (NBA teams)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: prod
        run: |
          python scripts/seed_nba_teams.py

      # Hydrate the per-year draft-results from their committed canonical files.
      # Idempotent (upsert by year+pick): re-running re-syncs, so appending a new
      # year's file or new picks just needs a re-deploy. Names resolve against
      # this environment's player DB; unmatched picks are reported, not fatal.
      - name: Sync draft results (canonical records)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Importing the app (for shared URL normalization + the matcher)
          # instantiates Settings, which requires these even though the ingest
          # itself doesn't use them.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: prod
        run: |
          shopt -s nullglob
          for f in scripts/data/draft_results_*.txt; do
            echo "== Ingesting $f =="
            python scripts/ingest_draft_results.py --file "$f"
          done

      - name: Update cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "news-ingestion-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-ingestion-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League roster cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-roster-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      # #536 -- Summer League Desk cron machine. Double-gated, unlike every other cron
      # in this workflow: (1) the `enable_desk_cron` workflow_dispatch input must be
      # explicitly set true for this run -- a human attesting staging already proved a
      # successful tick -- and (2) production's own read-only preflight check must
      # still pass against the just-deployed prod database. Job A
      # (`scripts/build_sl_cohort_baselines.py`) is NEVER run here -- it's a
      # deliberate, one-time human step against prod (see
      # docs/plans/summer-league-desk-536-deploy-runbook.md).
      - name: Check Summer League Desk readiness (preflight)
        id: desk_preflight
        if: inputs.enable_desk_cron == true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: prod
        run: |
          if python scripts/check_sl_desk_readiness.py preflight; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Summer League Desk preflight failed; skipping Desk cron machine create/update this deploy."
          fi

      # Idempotent create-if-absent / update-if-present so repeated deploys never
      # duplicate the machine (mirrors the "Update X cron machine (if exists)" steps
      # above, but this one also creates the machine the first time both gates pass,
      # matching fly.cron.desk.toml's deployment doc).
      - name: Deploy/update Summer League Desk cron machine (double-gated)
        if: inputs.enable_desk_cron == true && steps.desk_preflight.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_IMAGE=$(flyctl machine list --app draft-app-prod --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app-prod --json | jq -r '.[] | select(.name == "summer-league-desk-cron") | .id')
          if [ -z "$APP_IMAGE" ] || [ "$APP_IMAGE" == "null" ]; then
            echo "Could not determine app image; skipping Desk cron machine create/update"
          elif [ -n "$CRON_MACHINE_ID" ]; then
            echo "Updating Desk cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app-prod \
              --image "$APP_IMAGE" \
              --yes
          else
            echo "No Desk cron machine found; creating one (schedule=hourly)"
            flyctl machine run "$APP_IMAGE" \
              --app draft-app-prod \
              --schedule hourly \
              --name summer-league-desk-cron \
              --region ewr \
              --memory 1024 \
              --cpus 1 \
              --entrypoint "/app/.venv/bin/python" \
              -- scripts/sl_desk_tick.py
          fi
