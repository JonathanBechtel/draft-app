name: Deploy to Fly (stage)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-main-deploy
      cancel-in-progress: true

    environment:
      name: draft-app-stage
      url: https://draft-app.fly.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Fly token present
        run: test -n "${{ secrets.FLY_API_TOKEN }}" || (echo "Missing FLY_API_TOKEN secret"; exit 1)

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app & Alembic
        run: |
          python -m pip install --upgrade pip
          pip install . alembic

      - name: Ensure stage secrets exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGE_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          flyctl secrets set \
            DATABASE_URL="${STAGE_DATABASE_URL}" \
            SECRET_KEY="${STAGE_SECRET_KEY}" \
            ENV=stage \
            LOG_LEVEL=INFO \
            ACCESS_LOG=false \
            --app draft-app

      - name: Run Alembic migrations (stage)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade heads

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config deploy/fly/fly.toml --remote-only

      # Reference data the recap joins against (idempotent — skips existing).
      - name: Seed reference data (NBA teams)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: stage
        run: |
          python scripts/seed_nba_teams.py

      # Hydrate the per-year draft-results from their committed canonical files
      # (idempotent upsert). Keeps staging's data in sync with the repo on every
      # merge to main; unmatched picks are reported, not fatal.
      - name: Sync draft results (canonical records)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Importing the app (for shared URL normalization + the matcher)
          # instantiates Settings, which requires these even though the ingest
          # itself doesn't use them.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: stage
        run: |
          shopt -s nullglob
          for f in scripts/data/draft_results_*.txt; do
            echo "== Ingesting $f =="
            python scripts/ingest_draft_results.py --file "$f"
          done

      - name: Update cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app --json | jq -r '.[] | select(.name == "news-ingestion-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            # --command is set on every update, not just at creation: a machine's argv is
            # frozen when `machine run` creates it, so an image-only update happily ships
            # a new image that no longer contains the old entrypoint path. That is exactly
            # how #685 broke this cron on stage -- the deploy went green while every tick
            # died on "can't open file". Re-declaring it here makes the machine converge.
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app \
              --image "$APP_IMAGE" \
              --command "-m app.cli.cron_runner" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League metrics compaction cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_IMAGE=$(flyctl machine list --app draft-app --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app --json | jq -r '.[] | select(.name == "summer-league-metrics-compact-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app \
              --image "$APP_IMAGE" \
              --command "-m app.cli.summer_league_metrics_compact" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app --json | jq -r '.[] | select(.name == "summer-league-ingestion-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app \
              --image "$APP_IMAGE" \
              --command "-m app.cli.summer_league_ingest_runner" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      - name: Update Summer League roster cron machine (if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Get the image from the just-deployed app machine
          APP_IMAGE=$(flyctl machine list --app draft-app --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app --json | jq -r '.[] | select(.name == "summer-league-roster-cron") | .id')
          if [ -n "$CRON_MACHINE_ID" ] && [ -n "$APP_IMAGE" ] && [ "$APP_IMAGE" != "null" ]; then
            echo "Updating cron machine $CRON_MACHINE_ID with image: $APP_IMAGE"
            flyctl machine update "$CRON_MACHINE_ID" \
              --app draft-app \
              --image "$APP_IMAGE" \
              --command "-m app.cli.summer_league_roster_runner" \
              --yes
          else
            echo "No cron machine found or could not determine app image"
          fi

      # #536 -- Summer League Desk cron machine. Unlike the crons above, this one is
      # *readiness-gated*: `check_sl_desk_readiness.py preflight` is a read-only check
      # confirming this year's competition(s) are registered and Job A
      # (`scripts/build_sl_cohort_baselines.py`) has produced an active baseline for
      # every required grain. Job A is NEVER run here -- it's a deliberate, one-time
      # human step (see docs/plans/summer-league-desk-536-deploy-runbook.md). When
      # preflight fails, the create/update step below is skipped entirely rather than
      # deploying new code onto a cron that would just raise on its next tick.
      - name: Check Summer League Desk readiness (preflight)
        id: desk_preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: stage
        run: |
          if python scripts/check_sl_desk_readiness.py preflight; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Summer League Desk preflight failed; skipping Desk cron machine create/update this deploy."
          fi

      # Idempotent create-if-absent / update-if-present so repeated deploys never
      # duplicate the machine (mirrors the "Update X cron machine (if exists)" steps
      # above, but this one also creates the machine the first time preflight passes,
      # matching fly.cron.desk.stage.toml's deployment doc).
      - name: Deploy/update Summer League Desk cron machine (preflight-gated)
        if: steps.desk_preflight.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_IMAGE=$(flyctl machine list --app draft-app --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          CRON_MACHINE_ID=$(flyctl machine list --app draft-app --json | jq -r '.[] | select(.name == "summer-league-desk-cron") | .id')
          if [ -z "$APP_IMAGE" ] || [ "$APP_IMAGE" == "null" ]; then
            echo "Could not determine app image; skipping Desk cron machine create/update"
          elif [ -n "$CRON_MACHINE_ID" ]; then
            echo "Waiting for Desk cron machine $CRON_MACHINE_ID to stop before updating"
            if flyctl machine wait "$CRON_MACHINE_ID" \
              --app draft-app \
              --state stopped \
              --wait-timeout 30m; then
              echo "Updating stopped Desk cron machine with image: $APP_IMAGE"
              flyctl machine update "$CRON_MACHINE_ID" \
                --app draft-app \
                --image "$APP_IMAGE" \
                --command "-m app.cli.sl_desk_tick" \
                --skip-start \
                --yes
              # `machine update` does not reliably re-arm Fly's hourly schedule for a
              # scheduled machine left stopped -- confirmed by a prod incident where
              # several same-night deploys each updated-and-left-stopped this machine
              # and it then sat idle for 8+ hours with no further ticks. Starting it
              # here both kicks off an immediate tick on the new image and re-arms
              # the schedule.
              flyctl machine start "$CRON_MACHINE_ID" --app draft-app
            else
              echo "::warning::Desk cron machine did not stop within 30m; skipping its image update so the active tick is not interrupted."
            fi
          else
            echo "No Desk cron machine found; creating one (schedule=hourly)"
            flyctl machine run "$APP_IMAGE" \
              --app draft-app \
              --schedule hourly \
              --name summer-league-desk-cron \
              --region ewr \
              --memory 1024 \
              --cpus 1 \
              --entrypoint "/app/.venv/bin/python" \
              -- -m app.cli.sl_desk_tick
          fi

      # #699 -- the Desk latency-class machines (fast / projection / backbone).
      # See docs/plans/summer-league-desk-simplification-spec.md §2 and
      # deploy/fly/fly.cron.desk.fast.toml for why the split exists and what each
      # class does. Staging creates all three whenever the same preflight above
      # passes: staging is where the partition is proven before the production
      # `enable_desk_class_crons` gate is opened.
      #
      # These run ALONGSIDE `summer-league-desk-cron` on staging. That duplicates
      # work but is deliberate -- it lets one environment show the composite and
      # the three classes producing the same result, which is the equivalence
      # check the split is only trustworthy with. On production the composite is
      # stopped once the classes are proven (see the toml header's step 4).
      #
      # Fly scheduled machines support only hourly/daily/weekly/monthly, so the
      # fast class runs hourly, not the spec's aspirational "minutes" -- which is
      # consistent with the settled product decision that hourly is the promise
      # and sub-hourly is explicitly out of scope.
      #
      # `--command` is re-declared on every update path: `flyctl machine update`
      # does not preserve a machine's argv, which bit production once (PR #686).
      - name: Deploy/update Summer League Desk latency-class cron machines (preflight-gated)
        if: steps.desk_preflight.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_IMAGE=$(flyctl machine list --app draft-app --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")] | first | .config.image')
          if [ -z "$APP_IMAGE" ] || [ "$APP_IMAGE" == "null" ]; then
            echo "Could not determine app image; skipping Desk latency-class machines"
            exit 0
          fi
          # name|module|schedule|memory
          for SPEC in \
            "summer-league-desk-fast-cron|app.cli.sl_desk_fast_tick|hourly|512" \
            "summer-league-desk-projection-cron|app.cli.sl_desk_projection_tick|hourly|1024" \
            "summer-league-desk-backbone-cron|app.cli.sl_desk_backbone_tick|daily|2048"; do
            NAME="${SPEC%%|*}"; REST="${SPEC#*|}"
            MODULE="${REST%%|*}"; REST="${REST#*|}"
            SCHEDULE="${REST%%|*}"; MEMORY="${REST##*|}"
            MACHINE_ID=$(flyctl machine list --app draft-app --json | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id')
            if [ -n "$MACHINE_ID" ]; then
              echo "Waiting for $NAME ($MACHINE_ID) to stop before updating"
              if flyctl machine wait "$MACHINE_ID" --app draft-app --state stopped --wait-timeout 15m; then
                flyctl machine update "$MACHINE_ID" \
                  --app draft-app \
                  --image "$APP_IMAGE" \
                  --command "-m $MODULE" \
                  --skip-start \
                  --yes
                # `machine update` does not reliably re-arm the schedule for a
                # machine left stopped; starting it re-arms and runs once now.
                flyctl machine start "$MACHINE_ID" --app draft-app
              else
                echo "::warning::$NAME did not stop within 15m; skipping its image update this deploy."
              fi
            else
              echo "Creating $NAME (schedule=$SCHEDULE)"
              flyctl machine run "$APP_IMAGE" \
                --app draft-app \
                --schedule "$SCHEDULE" \
                --name "$NAME" \
                --region ewr \
                --memory "$MEMORY" \
                --cpus 1 \
                --entrypoint "/app/.venv/bin/python" \
                -- -m "$MODULE"
            fi
          done

      # Post-deploy verification, mirroring the prod step in fly-deploy-prod.yml.
      # The #686 incident (Desk cron left on a stale image) was noticed manually on
      # stage first -- this closing net previously existed only for prod, so the same
      # drift shape on stage had no backstop of its own. summer-league-desk-cron and
      # the latency-class/metrics-compaction crons are optional here because they are
      # preflight-/readiness-gated and may not exist yet on a fresh staging
      # environment; drift on one that DOES exist still fails regardless.
      - name: Verify Summer League cron image digests (post-deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python scripts/verify_cron_image_digests.py \
            --app draft-app \
            --machine news-ingestion-cron \
            --machine summer-league-ingestion-cron \
            --machine summer-league-desk-cron \
            --machine summer-league-roster-cron \
            --machine summer-league-metrics-compact-cron \
            --machine summer-league-desk-fast-cron \
            --machine summer-league-desk-projection-cron \
            --machine summer-league-desk-backbone-cron \
            --optional-machine summer-league-desk-cron \
            --optional-machine summer-league-metrics-compact-cron \
            --optional-machine summer-league-desk-fast-cron \
            --optional-machine summer-league-desk-projection-cron \
            --optional-machine summer-league-desk-backbone-cron
