name: PR Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-fork:
    # Safe path for PRs from forks: no secrets, ephemeral Postgres service
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: draftguru_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # App/test config
      ENV: stage
      DEBUG: "0"
      ACCESS_LOG: "0"
      SQL_ECHO: "0"
      AUTO_INIT_DB: "0"  # rely on Alembic + test fixtures
      SECRET_KEY: test
      # DB config (use service container)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/draftguru_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/draftguru_test
      PYTEST_ALLOW_DB: "1"
      # CI runs against an ephemeral service container, so DATABASE_URL and
      # TEST_DATABASE_URL intentionally point at the same DB. Allow it.
      PYTEST_ALLOW_TEST_DB_EQUALS_DATABASE_URL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so diff-cover can compare against the PR base branch.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Import contracts (import-linter)
        run: lint-imports

      - name: Complexity ratchet
        run: python scripts/check_complexity_ratchet.py

      - name: File-size ratchet
        # Enforces against the PR merge base, alongside the diff-cover gate the
        # diff-scoped tooling already lives in. Pre-commit runs the same script in
        # warn mode. See docs/plans/programmatic-code-discipline.md §1.4.
        run: python scripts/check_file_size_ratchet.py --against origin/${{ github.base_ref }} --enforce

      - name: Migration safety
        # Diff-scoped against the PR merge base: only revisions this PR adds or edits
        # are evaluated, since the existing ones have already run in production.
        # See docs/plans/programmatic-code-discipline.md §1.7 and incident #669.
        run: python scripts/check_migration_safety.py --against origin/${{ github.base_ref }}

      - name: Cache mypy incremental state
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py312-

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Reset test database (drop schema)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          raw_url = os.environ["DATABASE_URL"]
          url = raw_url.replace("+asyncpg", "")
          conn = psycopg.connect(url, autocommit=True)
          with conn.cursor() as cur:
              cur.execute("DROP SCHEMA IF EXISTS public CASCADE;")
              cur.execute("CREATE SCHEMA public;")
          conn.close()
          print("Reset schema public in test database")
          PY

      - name: Alembic upgrade head
        run: alembic upgrade heads

      - name: Run tests
        # Match the runner's four cores. Extra workers increase Postgres schema
        # setup and lock contention without improving elapsed time.
        run: |
          nproc && free -h | head -2
          pytest -q --ignore=tests/visual -n 4 --dist worksteal --durations=20 --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: tests-fork
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Patch coverage gate (diff-cover)
        # Fail the PR if fewer than 80% of newly changed app/ lines are covered.
        # Compares the working tree against the PR base branch (merge-base).
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

  tests-secrets:
    # Same-repo PRs use environment secrets from draft-app-dev.
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    environment: draft-app-dev
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: draftguru_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ENV: dev
      DEBUG: "0"
      ACCESS_LOG: "0"
      SQL_ECHO: "0"
      AUTO_INIT_DB: "0"  # rely on Alembic + test fixtures
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/draftguru_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/draftguru_test
      PYTEST_ALLOW_DB: "1"
      # CI runs against an ephemeral service container, so DATABASE_URL and
      # TEST_DATABASE_URL intentionally point at the same DB. Allow it.
      PYTEST_ALLOW_TEST_DB_EQUALS_DATABASE_URL: "1"
      # SECRET_KEY may be provided by the environment; default to test if missing
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so diff-cover can compare against the PR base branch.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Import contracts (import-linter)
        run: lint-imports

      - name: Complexity ratchet
        run: python scripts/check_complexity_ratchet.py

      - name: File-size ratchet
        # Enforces against the PR merge base, alongside the diff-cover gate the
        # diff-scoped tooling already lives in. Pre-commit runs the same script in
        # warn mode. See docs/plans/programmatic-code-discipline.md §1.4.
        run: python scripts/check_file_size_ratchet.py --against origin/${{ github.base_ref }} --enforce

      - name: Migration safety
        # Diff-scoped against the PR merge base: only revisions this PR adds or edits
        # are evaluated, since the existing ones have already run in production.
        # See docs/plans/programmatic-code-discipline.md §1.7 and incident #669.
        run: python scripts/check_migration_safety.py --against origin/${{ github.base_ref }}

      - name: Cache mypy incremental state
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py312-

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Default SECRET_KEY when missing
        run: |
          if [ -z "${{ secrets.SECRET_KEY }}" ]; then
            echo "SECRET_KEY=test" >> $GITHUB_ENV
          fi

      - name: Reset test database (drop schema)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          raw_url = os.environ["DATABASE_URL"]
          url = raw_url.replace("+asyncpg", "")
          conn = psycopg.connect(url, autocommit=True)
          with conn.cursor() as cur:
              cur.execute("DROP SCHEMA IF EXISTS public CASCADE;")
              cur.execute("CREATE SCHEMA public;")
          conn.close()
          print("Reset schema public in test database")
          PY

      - name: Alembic upgrade head
        run: alembic upgrade heads

      - name: Run tests
        # Match the runner's four cores. Extra workers increase Postgres schema
        # setup and lock contention without improving elapsed time.
        run: |
          nproc && free -h | head -2
          pytest -q --ignore=tests/visual -n 4 --dist worksteal --durations=20 --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: tests-secrets
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Patch coverage gate (diff-cover)
        # Fail the PR if fewer than 80% of newly changed app/ lines are covered.
        # Compares the working tree against the PR base branch (merge-base).
        # Only meaningful for pull_request runs; a push-to-main run has no PR
        # base branch to diff against.
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
