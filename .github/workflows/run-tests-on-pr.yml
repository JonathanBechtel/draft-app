name: Main Tests

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: main-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-main:
    # Test only merged main commits. Deploy workflows intentionally run no
    # duplicate Python suite; they retain target-environment migrations and
    # readiness checks only.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: draftguru_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ENV: dev
      DEBUG: "0"
      ACCESS_LOG: "0"
      SQL_ECHO: "0"
      AUTO_INIT_DB: "0"  # rely on Alembic + test fixtures
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/draftguru_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/draftguru_test
      PYTEST_ALLOW_DB: "1"
      # CI runs against an ephemeral service container, so DATABASE_URL and
      # TEST_DATABASE_URL intentionally point at the same DB. Allow it.
      PYTEST_ALLOW_TEST_DB_EQUALS_DATABASE_URL: "1"
      SECRET_KEY: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so diff-cover can compare against the PR base branch.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Cache mypy incremental state
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py312-

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Reset test database (drop schema)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          raw_url = os.environ["DATABASE_URL"]
          url = raw_url.replace("+asyncpg", "")
          conn = psycopg.connect(url, autocommit=True)
          with conn.cursor() as cur:
              cur.execute("DROP SCHEMA IF EXISTS public CASCADE;")
              cur.execute("CREATE SCHEMA public;")
          conn.close()
          print("Reset schema public in test database")
          PY

      - name: Alembic upgrade head
        run: alembic upgrade heads

      - name: Run tests
        # Eight xdist workers overlap the DB-bound tests; each worker is its own
        # pytest session, so the integration fixtures give every worker an
        # isolated schema (see tests/integration/conftest.py test_schema).
        run: |
          nproc && free -h | head -2
          pytest -q --ignore=tests/visual -n 8 --dist worksteal --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: tests-main
          fail_ci_if_error: false
