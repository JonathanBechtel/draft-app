name: Summer League 2027 preflight reminder

# Ticket #718 (docs/plans/summer-league-2027-preflight-runbook.md): the desk latency-class
# partition (#699 / PR #706) is dormant on production by default, and promoting it before
# Vegas 2027 is a manual sequence that nothing schedules. Without an explicit reminder, the
# promotion window can pass unnoticed the same way #669's "operational acceptance deferred
# past merge" did. This workflow's only job is to open one GitHub issue pointing at the
# runbook once the T-30d preflight window opens for the 2027 event.
#
# Deliberately an *observation*, not a deploy gate -- it only opens an issue; it never touches
# Fly or the database. Pattern-matched from deploy-freshness.yml's scheduled-job shape (a
# `schedule:` trigger plus a `workflow_dispatch` escape hatch for manual testing).
#
# GUARD AGAINST DUPLICATES: a cron `schedule` fires on every matching day, and this cron
# matches every day in June across every future year, not just 2027-06-01. Two independent
# guards keep the issue to exactly one:
#   1. A year check -- the job only proceeds past setup when the current UTC year is 2027 (or
#      `force_run` is explicitly set via workflow_dispatch, for testing).
#   2. A `gh issue list` dedup check -- if an open issue with this workflow's marker title
#      already exists, the create step is skipped. This also makes the June-daily cadence safe:
#      the first day in June 2027 this runs, it creates the issue; every subsequent day that
#      month it finds the existing issue and no-ops.

on:
  schedule:
    # 13:00 UTC, every day in June, every year. Combined with the year + dedup guards below,
    # this reduces to "the first successful run on or after 2027-06-01" -- daily-in-June is
    # deliberately more robust than a single fixed-date cron entry, since GitHub Actions
    # schedules are best-effort (can be delayed under load) and are auto-disabled after 60
    # days of repository inactivity, either of which could cause a single `1 6 *` date to be
    # silently missed.
    - cron: "0 13 * 6 *"
  workflow_dispatch:
    inputs:
      force_run:
        description: >-
          Bypass the "current year is 2027" guard and open the reminder issue now (or reuse
          the existing one if already open). For testing this workflow only -- do not use to
          re-trigger the real 2027 reminder outside of testing.
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check year guard
        id: guard
        run: |
          CURRENT_YEAR="$(date -u +%Y)"
          if [ "$CURRENT_YEAR" = "2027" ] || [ "${{ inputs.force_run }}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Current UTC year is $CURRENT_YEAR, not 2027, and force_run was not set -- no-op."
          fi

      - name: Check for an existing open reminder issue
        id: dedup
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search 'in:title "Summer League 2027 preflight window is open"' \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reminder issue #$EXISTING is already open -- skipping create."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the preflight reminder issue
        if: steps.guard.outputs.proceed == 'true' && steps.dedup.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Summer League 2027 preflight window is open" \
            --body "$(cat <<'EOF'
          The T-30d preflight window for Vegas Summer League 2027 has opened.

          Work through `docs/plans/summer-league-2027-preflight-runbook.md`, starting with the
          T-30d section:

          1. Prod deploy currency check (`scripts/check_deploy_freshness.py`).
          2. Roster-cron year configuration (`SL_ROSTER_YEAR` / `SL_ROSTER_FORCE`).
          3. Staging replay soak of the Desk latency-class machines (the replay harness plus
             live `summer_league_pipeline_states` rows on staging).

          Once T-30d is green, the runbook's T-14d section covers the desk latency-class
          promotion sequence for production (`enable_desk_class_crons`), including the manual
          "stop the composite Desk cron" step and its rollback path.

          Before executing anything, pin the runbook's placeholder T-30d/T-14d dates to the
          actual 2027 Summer League schedule once the NBA has announced it -- the runbook was
          written before those dates were public.

          This issue was opened automatically by `.github/workflows/preflight-reminder.yml`.
          Close it once the T-30d checks are done (the runbook itself tracks T-14d/during-event/
          T+close).
          EOF
          )"
