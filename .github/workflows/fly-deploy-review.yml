name: Deploy Review App on PR
on:
  # Run this workflow on every PR event. Existing review apps will be updated when the PR is updated.
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Set these to your Fly.io organization and preferred region.
  FLY_REGION: ewr
  FLY_ORG: personal
  # Neon project that hosts the per-PR ephemeral database branches.
  NEON_PROJECT_ID: lingering-tree-42020349
  # Parent Neon branch each PR database is forked from. We fork from
  # production (not development) because production is the only branch whose
  # alembic state is always consistent with its schema — it's mutated solely
  # by controlled prod deploys, never by review apps. (development carries
  # drift from the old shared-review-DB era: schema ahead of alembic_version.)
  # DraftGuru's data is public, so prod data in previews is acceptable.
  NEON_PARENT_BRANCH: production

jobs:
  review_app:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # Only run one deployment at a time per PR.
    concurrency:
      group: pr-${{ github.event.number }}

    # Deploying apps with this "review" environment allows the URL for the app to be displayed in the PR UI.
    # Feel free to change the name of this environment.
    environment:
      name: draft-app-dev
      # The script in the `deploy` sets the URL output for each review app.
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Give each PR its own isolated Neon database branch, forked from the
      # development branch. Previously every review app shared one database, so
      # a migration from one PR (e.g. an alembic revision only on that branch)
      # left the shared DB at a revision other PRs could not `alembic upgrade
      # head` past — failing the deploy on PRs that changed nothing. A per-PR
      # branch always migrates cleanly from a known parent. The action is
      # idempotent: on `synchronize` it returns the PR's existing branch.
      - name: Create Neon branch
        if: github.event.action != 'closed'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          branch_name: pr-${{ github.event.number }}
          database: draft_guru
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      # The Neon action emits a libpq URL (postgresql://...?sslmode=...). The
      # app needs the asyncpg driver prefix, and asyncpg rejects the libpq-only
      # sslmode/channel_binding query params, so strip them. Mask the result so
      # the credentialed URL never appears in logs.
      - name: Build asyncpg DATABASE_URL
        if: github.event.action != 'closed'
        id: dburl
        run: |
          raw='${{ steps.neon.outputs.db_url }}'
          async="postgresql+asyncpg://${raw#*://}"
          async="${async%%\?*}"
          echo "::add-mask::$async"
          echo "value=$async" >> "$GITHUB_OUTPUT"

      - name: Deploy PR app to Fly.io
        id: deploy
        uses: superfly/fly-pr-review-apps@1.2.1
        with:
          name: pr-${{ github.event.number }}-${{ github.event.repository.name }}
          config: deploy/fly/fly.toml
          region: ${{ env.FLY_REGION }}
          org: ${{ env.FLY_ORG }}
          secrets:
            ENV=dev
            LOG_LEVEL=INFO
            ACCESS_LOG=true
            DATABASE_URL=${{ steps.dburl.outputs.value }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}

      # Tear down the PR's Neon branch when the PR closes. The fly action above
      # already destroys the review app itself on a `closed` event.
      - name: Delete Neon branch
        if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
