repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.1
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--python-version=3.12"]
  - repo: local
    hooks:
      - id: request-transaction-policy
        name: Disallow commit/rollback in request code
        entry: python scripts/check_request_transaction_policy.py
        language: system
        files: ^app/(routes|services)/.*\.py$
      - id: route-conventions
        name: Enforce REST route conventions (response_model, status_code, DI, TemplateResponse)
        entry: python scripts/check_route_conventions.py
        language: system
        files: ^app/routes/.*\.py$
      - id: unscoped-delete
        name: Ban unscoped delete(Model) (P2 - retain history by default)
        entry: python scripts/check_unscoped_delete.py
        language: system
        files: ^(app|scripts)/.*\.py$
      - id: complexity-ratchet
        name: Block complexity growth beyond the baseline
        # Runs ruff --isolated so per-file-ignores cannot hide growth inside an
        # already-baselined file. Needs the whole tree, not per-file arguments.
        entry: python scripts/check_complexity_ratchet.py
        language: system
        pass_filenames: false
        files: ^(app|scripts)/.*\.py$
      - id: file-size-ratchet
        name: Warn when a change grows an oversized app/ module
        # Warns only here so feedback lands while context is fresh; CI enforces the
        # same rule against the PR merge base. Needs the whole changeset, not
        # per-file arguments, to evaluate net change.
        entry: python scripts/check_file_size_ratchet.py
        language: system
        pass_filenames: false
        files: ^app/.*\.py$
