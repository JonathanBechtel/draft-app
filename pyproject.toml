[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "draftguru"
version = "0.1.0"
description = "FastAPI + SQLModel skeleton for a draft analytics app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.116.1",
    "sqlmodel==0.0.24",
    "pydantic-settings==2.10.1",
    "psycopg==3.2.9",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "beautifulsoup4==4.12.3",
    "boto3",
    "curl_cffi==0.7.4",
    "google-genai",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "feedparser>=6.0.0",
    "resvg-py>=0.2.0",
    "Pillow>=10.0.0",
    "httpx>=0.28.0",
    "pgvector>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==5.0.0",
    "pytest-xdist==3.8.0",
    "diff-cover==9.2.0",
    "httpx==0.28.1",
    "import-linter==2.1",
    "ruff==0.13.0",
    "mypy==1.18.1",
    "pre-commit==3.8.0",
    "pandas-stubs",
    "playwright>=1.47.0",
    "pytest-playwright>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.cli.compute_metrics"
disable_error_code = "attr-defined,arg-type,call-overload,misc"

[tool.ruff]
# `.codex` holds local agent worktrees — full copies of the repo that CI never sees.
# Without excluding them, local `make lint` reports every finding twice over.
exclude = ["alembic", "tests", ".codex"]

[tool.ruff.lint]
# C901/PLR0915/PLR0913 target the over-populated functions inside over-populated
# services — a named root cause of the Summer League failures. Adopted with a
# ratchet, not all at once: the 95 files below are baselined in
# [tool.ruff.lint.per-file-ignores], and everything new must pass.
# See docs/plans/programmatic-code-discipline.md §1.6.
extend-select = ["D", "C901", "PLR0915", "PLR0913"]
# Ignore missing docstring rules - only enforce formatting on existing docstrings
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

# Complexity baseline — existing violations only. This list is a ratchet: entries
# may be removed as functions are simplified, never added. A new file, or a new
# rule violation in a file not listed for that rule, fails the build.
#
# Regenerate after a cleanup with:
#   ruff check --select C901,PLR0915,PLR0913 --output-format json .
[tool.ruff.lint.per-file-ignores]
