[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Integration tests use a fresh schema per xdist worker, so the suite is safe
# to run in parallel. Eight workers keep local DB-backed runs under three
# minutes on the development machine; CI passes its own four-worker setting
# explicitly.
# Pass ``-n 0`` when debugging a test that needs a single process.
addopts = -n 8 --dist worksteal
